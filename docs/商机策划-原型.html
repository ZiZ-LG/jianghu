<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商机策划 · 行动排期日历（原型）</title>
<style>
/* ───────── 设计令牌：直接复用产品 app/src/styles.css 的语义变量 ───────── */
:root{
  --bg:#f1f5f9; --panel:#fff; --panel-2:#f8fafc;
  --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --faint:#94a3b8;
  --line:#e2e8f0; --hover:#eef2f6;
  --accent:#2563eb; --accent-soft:#eff6ff; --accent-ink:#1e40af;
  --shadow:rgba(15,23,42,.08);
  /* 事件按 G64111 gap 分类着色（方案 §6） */
  --ev-c:#2563eb; --ev-c-soft:#eff6ff;   /* 6必清 C 蓝 */
  --ev-p:#9333ea; --ev-p-soft:#f5f3ff;   /* 4优势 P 紫 */
  --ev-k:#d97706; --ev-k-soft:#fffbeb;   /* 1决胜 1K 金 */
  --ev-ms:#dc2626; --ev-ms-soft:#fef2f2; /* 里程碑 红 */
  --ev-tc:#64748b; --ev-tc-soft:#f1f5f9; /* 历史触点 灰 */
  /* 商机身份色 */
  --opp-1:#2563eb; --opp-2:#f97316; --opp-3:#16a34a;
  --radius:10px;
}
html[data-theme="dark"]{
  --bg:#0b1120; --panel:#131c2e; --panel-2:#1b2538;
  --ink:#e8edf5; --ink-2:#c0cbdb; --muted:#97a4b8; --faint:#6b788f;
  --line:#2a374d; --hover:#232f45;
  --accent:#3b82f6; --accent-soft:#18283f; --accent-ink:#93c5fd;
  --shadow:rgba(0,0,0,.45);
  --ev-c:#60a5fa; --ev-c-soft:#16263f;
  --ev-p:#c084fc; --ev-p-soft:#241a3a;
  --ev-k:#fbbf24; --ev-k-soft:#332611;
  --ev-ms:#f87171; --ev-ms-soft:#3a1d1d;
  --ev-tc:#94a3b8; --ev-tc-soft:#1b2538;
  color-scheme:dark;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased;
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}

/* ───────── 顶部应用条 ───────── */
.app-top{height:52px; flex-shrink:0; display:flex; align-items:center; gap:12px; padding:0 16px;
  background:var(--panel); border-bottom:1px solid var(--line);}
.logo{width:26px; height:26px; border-radius:6px; background:var(--ink); color:var(--panel);
  display:grid; place-items:center; font-weight:800; font-size:14px;}
html[data-theme="dark"] .logo{background:var(--accent); color:#fff;}
.cust{font-weight:700; font-size:14px;}
.cust small{display:block; font-weight:500; font-size:10px; color:var(--muted);}
.spacer{flex:1;}
/* 客户级 ViewTabs：切「镜头」 */
.view-tabs{display:inline-flex; gap:2px; padding:3px; background:var(--panel-2); border-radius:999px; border:1px solid var(--line);}
.vtab{display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:999px;
  font-size:13px; font-weight:600; color:var(--muted);}
.vtab:hover{color:var(--ink);}
.vtab.active{background:var(--panel); color:var(--accent); font-weight:800; box-shadow:0 1px 3px var(--shadow);}
.icon-btn{width:34px; height:34px; border-radius:8px; font-size:16px; display:grid; place-items:center; color:var(--muted);}
.icon-btn:hover{background:var(--hover); color:var(--ink);}

/* ───────── 日历工具栏 ───────── */
.planner-head{flex-shrink:0; display:flex; align-items:center; gap:10px; padding:12px 18px;
  background:var(--panel); border-bottom:1px solid var(--line);}
.nav-group{display:inline-flex; align-items:center; gap:2px;}
.nav-group button{width:30px; height:30px; border-radius:8px; font-size:15px; color:var(--ink-2); display:grid; place-items:center;}
.nav-group button:hover{background:var(--hover);}
.btn-today{padding:0 12px; height:30px; border-radius:8px; border:1px solid var(--line); font-size:12px; font-weight:600; color:var(--ink-2);}
.btn-today:hover{background:var(--hover);}
.period-title{font-size:18px; font-weight:800; letter-spacing:.3px; min-width:170px;}
.seg{display:inline-flex; gap:1px; padding:3px; background:var(--panel-2); border:1px solid var(--line); border-radius:9px;}
.seg button{padding:5px 14px; border-radius:7px; font-size:12px; font-weight:600; color:var(--muted);}
.seg button:hover{color:var(--ink);}
.seg button.active{background:var(--accent); color:#fff; font-weight:700;}
.chk{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-2); cursor:pointer; user-select:none;}
.chk input{accent-color:var(--accent);}
.btn-new{display:inline-flex; align-items:center; gap:5px; padding:0 14px; height:32px; border-radius:8px;
  background:var(--accent); color:#fff; font-size:13px; font-weight:700;}
.btn-new:hover{filter:brightness(1.06);}

/* ───────── 主体布局 ───────── */
.body{flex:1; display:flex; min-height:0;}
.cal-host{flex:1; min-width:0; padding:14px 18px; overflow:auto;}
.side{width:248px; flex-shrink:0; border-left:1px solid var(--line); background:var(--panel);
  padding:16px 14px; overflow-y:auto;}
.side h4{font-size:10px; font-weight:800; color:var(--faint); text-transform:uppercase; letter-spacing:.6px; margin:4px 0 9px;}
.side h4:not(:first-child){margin-top:20px;}
.legend-row{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-2); padding:4px 0;}
.lg-swatch{width:18px; height:12px; border-radius:4px; flex-shrink:0;}
.lg-bar{width:4px; height:16px; border-radius:2px; flex-shrink:0;}
.sugg{background:var(--panel-2); border:1px dashed var(--line); border-radius:10px; padding:10px; margin-bottom:8px;}
.sugg .t{font-size:12px; font-weight:600; color:var(--ink); line-height:1.4;}
.sugg .m{font-size:10px; color:var(--muted); margin-top:4px; display:flex; gap:6px; align-items:center;}
.sugg .pull{margin-top:7px; font-size:11px; color:var(--accent); font-weight:700;}

/* ═════════ 月视图 ═════════ */
.m-head{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px;}
.m-head div{text-align:center; font-size:11px; font-weight:700; color:var(--muted); padding:4px 0;}
.m-head div.we{color:var(--faint);}
.m-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:12px; overflow:hidden;}
.m-cell{background:var(--panel); min-height:104px; padding:5px 5px 3px; display:flex; flex-direction:column; gap:3px; position:relative;}
.m-cell.out{background:var(--panel-2);}
.m-cell.we{background:linear-gradient(0deg, color-mix(in srgb, var(--accent) 3%, var(--panel)), var(--panel));}
.m-cell.drop{outline:2px dashed var(--accent); outline-offset:-3px;}
.m-daynum{font-size:12px; font-weight:600; color:var(--ink-2); align-self:flex-start; width:22px; height:22px; display:grid; place-items:center; border-radius:50%;}
.m-cell.out .m-daynum{color:var(--faint);}
.m-daynum.today{background:var(--accent); color:#fff; font-weight:800;}
.chip{display:flex; align-items:center; gap:4px; font-size:11px; line-height:1.3; padding:2px 6px 2px 5px;
  border-radius:5px; cursor:pointer; border-left:3px solid var(--c,var(--accent)); background:var(--cs,var(--accent-soft));
  color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; user-select:none;}
.chip:hover{filter:brightness(.97); box-shadow:0 1px 3px var(--shadow);}
.chip .ic{font-size:10px; flex-shrink:0;}
.chip.done{opacity:.5; text-decoration:line-through;}
.chip.overdue{box-shadow:inset 0 0 0 1px var(--ev-ms);}
.chip.ms{font-weight:700; background:var(--ev-ms-soft); border-left-color:var(--ev-ms); color:var(--ev-ms);}
html[data-theme="dark"] .chip.ms{color:var(--ev-ms);}
.chip.tc{background:var(--ev-tc-soft); border-left-color:var(--ev-tc); color:var(--muted);}
.m-more{font-size:10px; color:var(--muted); font-weight:600; padding:1px 5px; cursor:pointer; border-radius:4px;}
.m-more:hover{background:var(--hover); color:var(--ink);}

/* ═════════ 周视图 ═════════ */
.w-overdue{margin-bottom:12px; padding:10px 12px; background:var(--ev-ms-soft); border:1px solid color-mix(in srgb,var(--ev-ms) 30%, transparent);
  border-radius:10px;}
.w-overdue .h{font-size:11px; font-weight:800; color:var(--ev-ms); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
.w-overdue .items{display:flex; flex-wrap:wrap; gap:6px;}
.w-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
.w-col{background:var(--panel); min-height:340px; display:flex; flex-direction:column;}
.w-colhead{text-align:center; padding:8px 0 7px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel);}
.w-colhead .dow{font-size:11px; color:var(--muted); font-weight:600;}
.w-colhead .dnum{font-size:18px; font-weight:800; margin-top:2px; width:32px; height:32px; line-height:32px; border-radius:50%; display:inline-block;}
.w-colhead.we{background:var(--panel-2);}
.w-colhead .dnum.today{background:var(--accent); color:#fff;}
.w-body{flex:1; padding:7px 6px; display:flex; flex-direction:column; gap:5px;}
.w-chip{padding:6px 8px; border-radius:7px; font-size:11.5px; line-height:1.35; cursor:pointer;
  border-left:3px solid var(--c,var(--accent)); background:var(--cs,var(--accent-soft));}
.w-chip:hover{box-shadow:0 1px 4px var(--shadow);}
.w-chip .top{display:flex; align-items:center; gap:5px; font-weight:600;}
.w-chip .sub{font-size:10px; color:var(--muted); margin-top:2px;}
.w-chip.done{opacity:.5; text-decoration:line-through;}
.w-chip.ms{background:var(--ev-ms-soft); border-left-color:var(--ev-ms);}
.w-chip.tc{background:var(--ev-tc-soft); border-left-color:var(--ev-tc);}

/* ═════════ 年视图 ═════════ */
.y-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.y-mini{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; cursor:pointer; transition:box-shadow .15s,transform .15s;}
.y-mini:hover{box-shadow:0 4px 14px var(--shadow); transform:translateY(-2px);}
.y-mini.cur{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.y-mtitle{font-size:13px; font-weight:800; margin-bottom:8px; display:flex; justify-content:space-between; align-items:baseline;}
.y-mtitle .cnt{font-size:10px; font-weight:600; color:var(--muted);}
.y-mhead{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:3px;}
.y-mhead div{text-align:center; font-size:8px; color:var(--faint);}
.y-mgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
.y-day{aspect-ratio:1; display:grid; place-items:center; font-size:9px; color:var(--ink-2); border-radius:4px; position:relative;}
.y-day.out{color:transparent;}
.y-day.today{background:var(--accent); color:#fff; font-weight:800;}
.y-dots{position:absolute; bottom:1px; left:0; right:0; display:flex; justify-content:center; gap:1px;}
.y-dot{width:3px; height:3px; border-radius:50%;}

/* ───────── 详情抽屉 ───────── */
.drawer-mask{position:fixed; inset:0; background:rgba(15,23,42,.25); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40;}
.drawer-mask.open{opacity:1; pointer-events:auto;}
.drawer{position:fixed; top:0; right:0; height:100%; width:380px; max-width:92vw; background:var(--panel);
  border-left:1px solid var(--line); box-shadow:-8px 0 24px var(--shadow); transform:translateX(100%); transition:transform .22s cubic-bezier(.4,0,.2,1); z-index:41;
  display:flex; flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:16px 18px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; gap:10px;}
.drawer-head .t{font-size:16px; font-weight:800; line-height:1.35; flex:1;}
.drawer-head .x{font-size:20px; color:var(--muted); width:30px; height:30px; border-radius:7px; display:grid; place-items:center; flex-shrink:0;}
.drawer-head .x:hover{background:var(--hover); color:var(--ink);}
.drawer-body{flex:1; overflow-y:auto; padding:16px 18px;}
.d-row{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
.d-row .k{width:64px; flex-shrink:0; color:var(--muted); font-size:12px;}
.d-row .v{color:var(--ink); flex:1;}
.tag{display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700;}
.d-actions{padding:14px 18px; border-top:1px solid var(--line); display:flex; gap:8px;}
.d-actions button{flex:1; height:38px; border-radius:9px; font-size:13px; font-weight:700;}
.b-ghost{border:1px solid var(--line); color:var(--ink-2);}
.b-ghost:hover{background:var(--hover);}
.b-primary{background:var(--accent); color:#fff;}
.b-primary:hover{filter:brightness(1.06);}
.win-pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:800;}

/* 当日弹层（+N more / 单元格） */
.pop-mask{position:fixed; inset:0; z-index:30;}
.daypop{position:fixed; width:260px; background:var(--panel); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 12px 32px var(--shadow); z-index:31; padding:12px; max-height:60vh; overflow-y:auto;}
.daypop .h{font-size:13px; font-weight:800; margin-bottom:8px;}
.daypop .chip{margin-bottom:4px;}

.hint{font-size:11px; color:var(--faint); margin-top:10px; line-height:1.5;}
.proto-tag{position:fixed; left:12px; bottom:10px; font-size:10px; color:var(--faint);
  background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:3px 8px; z-index:20;}
@media(max-width:880px){ .side{display:none;} .period-title{min-width:0; font-size:15px;} .planner-head{flex-wrap:wrap;} }
</style>
</head>
<body>

<!-- 顶部应用条 + 客户级 ViewTabs -->
<div class="app-top">
  <div class="logo">江</div>
  <div class="cust">西部电力建设集团<small>客户工作台 · 3 个商机</small></div>
  <div class="spacer"></div>
  <div class="view-tabs">
    <button class="vtab" id="tabWall">🕸 侦探墙</button>
    <button class="vtab active" id="tabPlanner">📅 商机策划</button>
  </div>
  <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
</div>

<!-- 日历工具栏 -->
<div class="planner-head">
  <div class="nav-group"><button id="prevBtn">‹</button><button id="nextBtn">›</button></div>
  <button class="btn-today" id="todayBtn">今天</button>
  <div class="period-title" id="periodTitle">2026年6月</div>
  <div class="spacer"></div>
  <label class="chk"><input type="checkbox" id="laneChk"> 按商机泳道</label>
  <div class="seg">
    <button data-view="year">年</button>
    <button data-view="month" class="active">月</button>
    <button data-view="week">周</button>
  </div>
  <button class="btn-new" id="newBtn">＋ 新行动</button>
</div>

<!-- 主体 -->
<div class="body">
  <div class="cal-host" id="calHost"></div>
  <div class="side">
    <h4>图例 · 事件三类</h4>
    <div class="legend-row"><span class="lg-swatch" style="background:var(--ev-c-soft); border-left:3px solid var(--ev-c);"></span>🎯 行动 · 6必清(C)</div>
    <div class="legend-row"><span class="lg-swatch" style="background:var(--ev-p-soft); border-left:3px solid var(--ev-p);"></span>🎯 行动 · 4优势(P)</div>
    <div class="legend-row"><span class="lg-swatch" style="background:var(--ev-k-soft); border-left:3px solid var(--ev-k);"></span>🎯 行动 · 1决胜(1K)</div>
    <div class="legend-row"><span class="lg-swatch" style="background:var(--ev-ms-soft); border-left:3px solid var(--ev-ms);"></span>🚩 商机里程碑</div>
    <div class="legend-row"><span class="lg-swatch" style="background:var(--ev-tc-soft); border-left:3px solid var(--ev-tc);"></span>📌 历史触点</div>

    <h4>商机泳道</h4>
    <div class="legend-row"><span class="lg-bar" style="background:var(--opp-1);"></span>西部风光储一体化平台</div>
    <div class="legend-row"><span class="lg-bar" style="background:var(--opp-2);"></span>智慧工地管理系统</div>
    <div class="legend-row"><span class="lg-bar" style="background:var(--opp-3);"></span>集团数字化审计平台</div>

    <h4>🔮 待排期建议（AI）</h4>
    <div class="sugg" id="sugg1">
      <div class="t">约赵建国汇报方案窗口</div>
      <div class="m">🎯 1K · 与最高决策人 A</div>
      <div class="pull">↪ 拖入日历排期</div>
    </div>
    <div class="sugg" id="sugg2">
      <div class="t">转化王教授（中立专家）</div>
      <div class="m">🎯 P1 · 多数人支持</div>
      <div class="pull">↪ 拖入日历排期</div>
    </div>
    <div class="hint">原型说明：AI（741 行动宝典）生成的动作先入「待排期建议」，拖入日历=人审采纳后才正式排期。</div>
  </div>
</div>

<!-- 详情抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><div class="t" id="dTitle"></div><button class="x" id="dClose">×</button></div>
  <div class="drawer-body" id="dBody"></div>
  <div class="d-actions" id="dActions"></div>
</div>

<div class="proto-tag">商机策划 · 原型 v1 · 数据为虚构示例</div>

<script>
/* ───────── 固定「今天」= 2026-06-05（与项目 currentDate 对齐） ───────── */
const TODAY = new Date(2026,5,5);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY_S = ymd(TODAY);
const WEEK_CN = ['一','二','三','四','五','六','日'];

/* ───────── 商机 ───────── */
const OPPS = {
  o1:{name:'西部风光储一体化平台', color:'var(--opp-1)', stage:'招投标',  win:62, band:'相对优势'},
  o2:{name:'智慧工地管理系统',     color:'var(--opp-2)', stage:'方案认可', win:38, band:'相对劣势'},
  o3:{name:'集团数字化审计平台',   color:'var(--opp-3)', stage:'客户立项', win:71, band:'绝对优势'},
};
const BAND_COLOR={'绝对优势':'#16a34a','相对优势':'#2563eb','相对劣势':'#f97316','绝对劣势':'#dc2626'};

/* ───────── 事件（三类，围绕 2026-06，含逾期/完成/跨商机） ───────── */
let EVENTS = [
  // 历史触点（VisitNote）
  {id:'t1', type:'touch', date:'2026-05-12', title:'初访西部电力·建立联系', opp:'o1', person:'前台/办公室'},
  {id:'t2', type:'touch', date:'2026-05-26', title:'钱大钧·招标参数摸底',   opp:'o1', person:'钱大钧（物资部长）'},
  {id:'t3', type:'touch', date:'2026-06-02', title:'孙学文·技术交流',       opp:'o3', person:'孙学文（专家组长）'},
  // 行动计划（PlanAction）
  {id:'a0', type:'action', date:'2026-05-28', title:'拜访钱大钧·摸清招标参数', opp:'o1', gap:'C5', person:'钱大钧（物资部长）', status:'done',
    scene:'物资部办公室', scripts:'以行业评标新规切入，请教本次招标参数倾向', target:'拿到评标规则与竞标家数'},
  {id:'a1', type:'action', date:'2026-06-03', title:'复盘钱大钧反馈·补招采5项', opp:'o1', gap:'P2', person:'钱大钧（物资部长）', status:'todo',

/* gap → 着色类 */
function gapVars(e){
  if(e.type==='milestone') return {c:'var(--ev-ms)', cs:'var(--ev-ms-soft)'};
  if(e.type==='touch')     return {c:'var(--ev-tc)', cs:'var(--ev-tc-soft)'};
  const g=e.gap||'';
  if(g.startsWith('C'))    return {c:'var(--ev-c)', cs:'var(--ev-c-soft)'};
  if(g.startsWith('P'))    return {c:'var(--ev-p)', cs:'var(--ev-p-soft)'};
  if(g==='1K')             return {c:'var(--ev-k)', cs:'var(--ev-k-soft)'};
  return {c:'var(--accent)', cs:'var(--accent-soft)'};
}
const isOverdue = e => e.type==='action' && e.status!=='done' && e.date < TODAY_S;
const evIcon = e => e.type==='milestone'?'🚩': e.type==='touch'?'📌':'🎯';

/* ───────── 状态 ───────── */
let state = { view:'month', cursor:new Date(2026,5,5), lanes:false };

/* 索引：日期 → 事件[] */
function indexByDate(){
  const m={};
  for(const e of EVENTS){ (m[e.date]=m[e.date]||[]).push(e); }
  for(const k in m){ m[k].sort((a,b)=> (a.type==='milestone'?-1:0)-(b.type==='milestone'?-1:0)); }
  return m;
}

/* ════════ 渲染入口 ════════ */
const host = document.getElementById('calHost');
function render(){
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('active', b.dataset.view===state.view));
  if(state.view==='month') renderMonth();
  else if(state.view==='week') renderWeek();
  else renderYear();
}

/* ════════ 月视图 ════════ */
function monthCells(cur){
  const y=cur.getFullYear(), mo=cur.getMonth();
  const first=new Date(y,mo,1);
  const lead=(first.getDay()+6)%7;             // 周一起始
  const start=new Date(y,mo,1-lead);
  const days=new Date(y,mo+1,0).getDate();
  const rows=Math.ceil((lead+days)/7);
  return {cells:Array.from({length:rows*7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;}), mo};
}
function renderMonth(){
  const cur=state.cursor;
  document.getElementById('periodTitle').textContent=`${cur.getFullYear()}年${cur.getMonth()+1}月`;
  const {cells,mo}=monthCells(cur);
  const idx=indexByDate();
  let html='<div class="m-head">'+WEEK_CN.map((w,i)=>`<div class="${i>=5?'we':''}">周${w}</div>`).join('')+'</div>';
  html+='<div class="m-grid">';
  for(const d of cells){
    const ds=ymd(d), out=d.getMonth()!==mo, we=(d.getDay()===0||d.getDay()===6);
    const evs=idx[ds]||[];
    const shown=evs.slice(0,3), extra=evs.length-shown.length;
    html+=`<div class="m-cell ${out?'out':''} ${we?'we':''}" data-date="${ds}" ondragover="event.preventDefault();this.classList.add('drop')" ondragleave="this.classList.remove('drop')">`;
    html+=`<div class="m-daynum ${ds===TODAY_S?'today':''}">${d.getDate()}</div>`;
    for(const e of shown) html+=chipHTML(e);
    if(extra>0) html+=`<div class="m-more" data-date="${ds}">+${extra} 更多</div>`;
    html+='</div>';
  }
  html+='</div>';
  host.innerHTML=html;
  bindMonth();
}
function chipHTML(e){
  const v=gapVars(e);
  const lane = state.lanes ? `border-left-color:${OPPS[e.opp].color} !important;` : '';
  const cls=['chip', e.type==='milestone'?'ms':'', e.type==='touch'?'tc':'', e.status==='done'?'done':'', isOverdue(e)?'overdue':''].join(' ');
  return `<div class="${cls}" draggable="true" data-id="${e.id}" style="--c:${v.c};--cs:${v.cs};${lane}" title="${e.title}">`+
    `<span class="ic">${evIcon(e)}</span><span>${e.title}</span></div>`;
}
function bindMonth(){
  host.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click',()=>openDrawer(el.dataset.id));
    el.addEventListener('dragstart',ev=>ev.dataTransfer.setData('id',el.dataset.id));
  });
  host.querySelectorAll('.m-cell').forEach(cell=>{
    cell.addEventListener('drop',ev=>{
      ev.preventDefault(); cell.classList.remove('drop');
      const id=ev.dataTransfer.getData('id'); const e=EVENTS.find(x=>x.id===id);
      if(e && e.type!=='touch'){ e.date=cell.dataset.date; render(); }
    });
  });
  host.querySelectorAll('.m-more').forEach(el=> el.addEventListener('click',ev=>{ ev.stopPropagation(); openDayPop(el.dataset.date, el); }));
}

/* ════════ 周视图 ════════ */
function weekDays(cur){
  const lead=(cur.getDay()+6)%7; const mon=new Date(cur); mon.setDate(cur.getDate()-lead);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
function renderWeek(){
  const days=weekDays(state.cursor), idx=indexByDate();
  const a=days[0], b=days[6];
  document.getElementById('periodTitle').textContent=`${a.getMonth()+1}月${a.getDate()}日 – ${b.getMonth()+1}月${b.getDate()}日`;
  // 逾期/未排期轨
  const overdue=EVENTS.filter(isOverdue);
  let html='';
  if(overdue.length){
    html+='<div class="w-overdue"><div class="h">⚠ 逾期未完成 · 需补救</div><div class="items">';
    html+=overdue.map(e=>{const v=gapVars(e);return `<div class="chip overdue" data-id="${e.id}" style="--c:${v.c};--cs:${v.cs}"><span class="ic">🎯</span><span>${e.title}（应于 ${e.date.slice(5)}）</span></div>`;}).join('');
    html+='</div></div>';
  }
  html+='<div class="w-grid">';
  for(const d of days){
    const ds=ymd(d), we=(d.getDay()===0||d.getDay()===6), evs=idx[ds]||[];
    html+=`<div class="w-col"><div class="w-colhead ${we?'we':''}"><div class="dow">周${WEEK_CN[(d.getDay()+6)%7]}</div><div class="dnum ${ds===TODAY_S?'today':''}">${d.getDate()}</div></div><div class="w-body">`;
    for(const e of evs){
      const v=gapVars(e);
      const lane=state.lanes?`border-left-color:${OPPS[e.opp].color} !important;`:'';
      const cls=['w-chip', e.type==='milestone'?'ms':'', e.type==='touch'?'tc':'', e.status==='done'?'done':''].join(' ');
      html+=`<div class="${cls}" data-id="${e.id}" style="--c:${v.c};--cs:${v.cs};${lane}"><div class="top"><span>${evIcon(e)}</span><span>${e.title}</span></div><div class="sub">${OPPS[e.opp].name}${e.gap?' · '+e.gap:''}${e.person?' · '+e.person:''}</div></div>`;
    }
    if(!evs.length) html+='<div style="font-size:11px;color:var(--faint);text-align:center;margin-top:18px;">—</div>';
    html+='</div></div>';
  }
  html+='</div>';
  host.innerHTML=html;
  host.querySelectorAll('.w-chip,.chip').forEach(el=> el.dataset.id && el.addEventListener('click',()=>openDrawer(el.dataset.id)));
}

/* ════════ 年视图 ════════ */
function renderYear(){
  const y=state.cursor.getFullYear();
  document.getElementById('periodTitle').textContent=`${y}年`;
  const idx=indexByDate();
  let html='<div class="y-grid">';
  for(let mo=0;mo<12;mo++){
    const first=new Date(y,mo,1), lead=(first.getDay()+6)%7, start=new Date(y,mo,1-lead);
    const days=new Date(y,mo+1,0).getDate(), rows=Math.ceil((lead+days)/7);
    let cnt=0;
    for(const e of EVENTS){ if(e.date.startsWith(`${y}-${String(mo+1).padStart(2,'0')}`)) cnt++; }
    const isCur=(mo===5);
    html+=`<div class="y-mini ${isCur?'cur':''}" data-mo="${mo}"><div class="y-mtitle">${mo+1}月 ${cnt?`<span class="cnt">${cnt} 事项</span>`:''}</div>`;
    html+='<div class="y-mhead">'+WEEK_CN.map(w=>`<div>${w}</div>`).join('')+'</div><div class="y-mgrid">';
    for(let i=0;i<rows*7;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const out=d.getMonth()!==mo, ds=ymd(d), evs=out?[]:(idx[ds]||[]);
      const dots=[...new Set(evs.map(e=>gapVars(e).c))].slice(0,3);
      html+=`<div class="y-day ${out?'out':''} ${ds===TODAY_S?'today':''}">${d.getDate()}`;
      if(dots.length) html+='<div class="y-dots">'+dots.map(c=>`<span class="y-dot" style="background:${c}"></span>`).join('')+'</div>';
      html+='</div>';
    }
    html+='</div></div>';
  }
  html+='</div>';
  host.innerHTML=html;
  host.querySelectorAll('.y-mini').forEach(el=> el.addEventListener('click',()=>{ state.cursor=new Date(y,+el.dataset.mo,1); state.view='month'; render(); }));
}

/* ════════ 详情抽屉 ════════ */
const drawer=document.getElementById('drawer'), dmask=document.getElementById('drawerMask');
function openDrawer(id){
  const e=EVENTS.find(x=>x.id===id); if(!e) return;
  const opp=OPPS[e.opp]; const v=gapVars(e);
  document.getElementById('dTitle').innerHTML=`${evIcon(e)} ${e.title}`;
  const typeLabel={action:'🎯 行动计划', milestone:'🚩 商机里程碑', touch:'📌 历史触点'}[e.type];
  let rows=`<div class="d-row"><div class="k">类型</div><div class="v">${typeLabel}</div></div>`;
  rows+=`<div class="d-row"><div class="k">日期</div><div class="v">${e.date}${isOverdue(e)?' <span style="color:var(--ev-ms);font-weight:700">· 已逾期</span>':''}</div></div>`;
  rows+=`<div class="d-row"><div class="k">商机</div><div class="v"><span class="tag" style="background:${opp.color};color:#fff">${opp.name}</span></div></div>`;
  rows+=`<div class="d-row"><div class="k">阶段</div><div class="v">${opp.stage} · <span class="win-pill" style="background:${BAND_COLOR[opp.band]}22;color:${BAND_COLOR[opp.band]}">趋赢力 ${opp.win}% · ${opp.band}</span></div></div>`;
  if(e.type==='action'){
    rows+=`<div class="d-row"><div class="k">补分项</div><div class="v">${e.gap?`<span class="tag" style="background:${v.cs};color:${v.c}">${e.gap} ${gapName(e.gap)}</span>`:'<span style="color:var(--muted)">— 非补分动作</span>'}</div></div>`;
    rows+=`<div class="d-row"><div class="k">目标人</div><div class="v">${e.person||'—'}</div></div>`;
    rows+=`<div class="d-row"><div class="k">场景</div><div class="v">${e.scene||'—'}</div></div>`;
    rows+=`<div class="d-row"><div class="k">话术</div><div class="v">${e.scripts||'<span style="color:var(--muted)">741 行动宝典可预填</span>'}</div></div>`;
    rows+=`<div class="d-row"><div class="k">期望</div><div class="v">${e.target||'—'}</div></div>`;
    rows+=`<div class="d-row"><div class="k">状态</div><div class="v">${statusTag(e.status)}</div></div>`;
  } else if(e.type==='milestone'){
    rows+=`<div class="d-row"><div class="k">说明</div><div class="v">商机关键节点（来自 Opportunity.expectedSignDate / 阶段推进，里程碑复用现有字段）</div></div>`;
  } else {
    rows+=`<div class="d-row"><div class="k">参与人</div><div class="v">${e.person||'—'}</div></div>`;
    rows+=`<div class="d-row"><div class="k">来源</div><div class="v">VisitNote 拜访纪要（只读回看）</div></div>`;
  }
  document.getElementById('dBody').innerHTML=rows;
  const act=document.getElementById('dActions');
  if(e.type==='action'){
    act.innerHTML = e.status==='done'
      ? `<button class="b-ghost" onclick="toggleDone('${e.id}')">↩ 取消完成</button><button class="b-primary" onclick="alert('原型：跳转侦探墙定位该 gap 与干系人')">🕸 去侦探墙</button>`
      : `<button class="b-ghost" onclick="alert('原型：跳转侦探墙定位该 gap 与干系人')">🕸 去侦探墙</button><button class="b-primary" onclick="toggleDone('${e.id}')">✓ 标记完成</button>`;
  } else {
    act.innerHTML=`<button class="b-ghost" onclick="closeDrawer()">关闭</button><button class="b-primary" onclick="alert('原型：跳转侦探墙')">🕸 去侦探墙</button>`;
  }
  drawer.classList.add('open'); dmask.classList.add('open');
}
function gapName(g){return {C1:'组织图',C2:'拍板人BI',C3:'立项材料',C4:'介入阶段',C5:'招采5项',C6:'UCV',P1:'多数支持',P2:'招采关键人',P3:'与D密谋',P4:'关键影响人','1K':'最高决策人A'}[g]||'';}
function statusTag(s){const m={todo:['待办','var(--muted)'],doing:['进行中','var(--accent)'],done:['已完成','#16a34a'],skipped:['已跳过','var(--faint)']}[s]||['',''];return `<span class="tag" style="background:${m[1]}22;color:${m[1]}">${m[0]}</span>`;}
function toggleDone(id){const e=EVENTS.find(x=>x.id===id); e.status=e.status==='done'?'todo':'done'; e.doneAt=e.status==='done'?TODAY_S:null; openDrawer(id); render();}
function closeDrawer(){drawer.classList.remove('open'); dmask.classList.remove('open');}
dmask.addEventListener('click',closeDrawer);
document.getElementById('dClose').addEventListener('click',closeDrawer);

/* ════════ 当日弹层（+N more） ════════ */
function openDayPop(ds,anchor){
  closeDayPop();
  const idx=indexByDate(), evs=idx[ds]||[];
  const mask=document.createElement('div'); mask.className='pop-mask'; mask.id='popMask'; mask.onclick=closeDayPop;
  const pop=document.createElement('div'); pop.className='daypop'; pop.id='dayPop';
  const d=new Date(ds+'T00:00:00');
  pop.innerHTML=`<div class="h">${d.getMonth()+1}月${d.getDate()}日 · ${evs.length} 项</div>`+evs.map(chipHTML).join('');
  document.body.append(mask,pop);
  const r=anchor.getBoundingClientRect();
  pop.style.left=Math.min(r.left, window.innerWidth-280)+'px';
  pop.style.top=Math.min(r.bottom+4, window.innerHeight-pop.offsetHeight-10)+'px';
  pop.querySelectorAll('.chip').forEach(el=> el.addEventListener('click',()=>{closeDayPop(); openDrawer(el.dataset.id);}));
}
function closeDayPop(){['popMask','dayPop'].forEach(id=>{const el=document.getElementById(id); if(el)el.remove();});}

/* ════════ 工具栏交互 ════════ */
document.querySelectorAll('.seg button').forEach(b=> b.addEventListener('click',()=>{state.view=b.dataset.view; render();}));
document.getElementById('prevBtn').addEventListener('click',()=>shift(-1));
document.getElementById('nextBtn').addEventListener('click',()=>shift(1));
function shift(dir){const c=state.cursor;
  if(state.view==='month') state.cursor=new Date(c.getFullYear(),c.getMonth()+dir,1);
  else if(state.view==='week'){state.cursor=new Date(c); state.cursor.setDate(c.getDate()+dir*7);}
  else state.cursor=new Date(c.getFullYear()+dir,c.getMonth(),1);
  render();
}
document.getElementById('todayBtn').addEventListener('click',()=>{state.cursor=new Date(2026,5,5); render();});
document.getElementById('laneChk').addEventListener('change',e=>{state.lanes=e.target.checked; render();});
