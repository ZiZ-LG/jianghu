name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      source_url: ${{ steps.plan.outputs.source_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test validation policy and PostgreSQL progress wrapper
        run: |
          python3 scripts/ci_validation_test.py
          python3 scripts/ci_postgres_progress_test.py
      - name: Select full execution or verified documentation reuse
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_validation.py plan
      - uses: actions/upload-artifact@v4
        with:
          name: ci-validation-context-${{ github.run_attempt }}
          path: ${{ steps.plan.outputs.context_path }}
          if-no-files-found: error
          retention-days: 2

  domain-contracts:
    needs: validation-plan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/domain-contracts
    steps:
      - uses: actions/checkout@v4
      - name: Verify validation plan (required check remains fail-closed)
        env:
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          PLAN_MODE: ${{ needs.validation-plan.outputs.mode }}
          SOURCE_URL: ${{ needs.validation-plan.outputs.source_url }}
        run: python3 "$GITHUB_WORKSPACE/scripts/ci_validation.py" guard
      - uses: actions/setup-node@v4
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/domain-contracts/package-lock.json
      - run: npm ci --install-links
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
      - run: npm run typecheck
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
      - run: npm test
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}

  app:
    needs: validation-plan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Verify validation plan (required check remains fail-closed)
        env:
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          PLAN_MODE: ${{ needs.validation-plan.outputs.mode }}
          SOURCE_URL: ${{ needs.validation-plan.outputs.source_url }}
        run: python3 "$GITHUB_WORKSPACE/scripts/ci_validation.py" guard
      - uses: actions/setup-node@v4
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --install-links
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
      - run: npm run typecheck
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
      - run: npm test
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
      - run: npm run build
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}

  server:
    needs: validation-plan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./test.db
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Verify validation plan (required check remains fail-closed)
        env:
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          PLAN_MODE: ${{ needs.validation-plan.outputs.mode }}
          SOURCE_URL: ${{ needs.validation-plan.outputs.source_url }}
        run: python3 "$GITHUB_WORKSPACE/scripts/ci_validation.py" guard
      - uses: actions/setup-node@v4
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --install-links
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
      - run: npm run generate
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
      - run: npm run schema:postgres:check
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
      - run: npm run typecheck
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
      - run: npm test
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}

  g64111:
    needs: validation-plan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/g64111
    steps:
      - uses: actions/checkout@v4
      - name: Verify validation plan (required check remains fail-closed)
        env:
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          PLAN_MODE: ${{ needs.validation-plan.outputs.mode }}
          SOURCE_URL: ${{ needs.validation-plan.outputs.source_url }}
        run: python3 "$GITHUB_WORKSPACE/scripts/ci_validation.py" guard
      - uses: actions/setup-node@v4
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/g64111/package-lock.json
      - run: npm ci
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
      - run: npm run typecheck
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
      - run: npm test
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}

  pde-kernel:
    needs: validation-plan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pde-kernel
    steps:
      - uses: actions/checkout@v4
      - name: Verify validation plan (required check remains fail-closed)
        env:
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          PLAN_MODE: ${{ needs.validation-plan.outputs.mode }}
          SOURCE_URL: ${{ needs.validation-plan.outputs.source_url }}
        run: python3 "$GITHUB_WORKSPACE/scripts/ci_validation.py" guard
      - uses: actions/setup-node@v4
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/pde-kernel/package-lock.json
      - run: npm ci
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
      - run: npm run typecheck
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
      - run: npm test
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}

  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - app
          - server
          - packages/domain-contracts
          - packages/g64111
          - packages/pde-kernel
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci --install-links
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high

  production-images:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-build-only
      JWT_SECRET: ci-build-only
      AI_KEY_SECRET: ci-build-only
      OUTBOUND_ALLOWED_HOSTS: example.com
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build server web

  postgres-operations:
    needs: validation-plan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify validation plan (required check remains fail-closed)
        env:
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          PLAN_MODE: ${{ needs.validation-plan.outputs.mode }}
          SOURCE_URL: ${{ needs.validation-plan.outputs.source_url }}
        run: python3 "$GITHUB_WORKSPACE/scripts/ci_validation.py" guard
      - run: python3 scripts/ci_postgres_progress.py
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}

  crm-release:
    needs: validation-plan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify validation plan (required check remains fail-closed)
        env:
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          PLAN_MODE: ${{ needs.validation-plan.outputs.mode }}
          SOURCE_URL: ${{ needs.validation-plan.outputs.source_url }}
        run: python3 "$GITHUB_WORKSPACE/scripts/ci_validation.py" guard
      - uses: actions/setup-python@v5
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
        with:
          python-version: '3.12'
      - run: python deploy/crm-api-release.test.py
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
      - name: Python 3.6 compatibility (no network or database)
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
        run: docker run --rm --network none -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/source:ro" -w /source python:3.6-alpine python deploy/crm-api-release.test.py
      - run: python -O deploy/crm-api-release.test.py
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}
      - run: python deploy/crm-api-release-integration.py
        if: ${{ needs.validation-plan.outputs.mode == 'full' }}

  validation-gate:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [validation-plan, domain-contracts, app, server, g64111, pde-kernel, dependency-audit, production-images, postgres-operations, crm-release]
    steps:
      - uses: actions/checkout@v4
      - name: Verify every required check and explicit validation mode
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_validation.py gate
