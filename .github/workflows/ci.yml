name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  domain-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/domain-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/domain-contracts/package-lock.json
      - run: npm ci --install-links
      - run: npm run typecheck
      - run: npm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --install-links
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./test.db
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --install-links
      - run: npm run generate
      - run: npm run typecheck
      - run: npm test

  pde-kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pde-kernel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/pde-kernel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
