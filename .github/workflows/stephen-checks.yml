name: Stephen checks

on:
  push:
    branches:
      - main
      - 'codex/stephen-*'
  pull_request:
    paths:
      - 'app/stephen/**'
      - 'app/public/stephen/**'
      - 'app/src/components/StephenSite.test.ts'
      - 'deploy/stephen*'
      - 'docs/content/stephen-*'
      - 'docs/content/stephen-*/**'
      - '.github/workflows/stephen-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stephen-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --install-links

      - name: Type-check Stephen site
        run: npx tsc --noEmit -p stephen/tsconfig.json

      - name: Type-check editorial intake
        run: npx tsc --noEmit -p stephen/tsconfig.editorial.json

      - name: Test Stephen site and intake
        run: npx vitest run --root stephen

      - name: Build Stephen site
        run: npm run build:stephen

      - name: Exercise the root-owned production stage boundary
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          artifact="$GITHUB_WORKSPACE/app/dist/stephen"
          metadata="$artifact/.stephen-release.json"
          archive="$RUNNER_TEMP/stephen-production-stage.tar.gz"
          node --experimental-strip-types stephen/scripts/stephen-release-cli.ts verify \
            --artifact "$artifact" \
            --source-sha "$SOURCE_SHA" \
            --metadata-file "$metadata" \
            > "$RUNNER_TEMP/stephen-production-stage-metadata.json"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C "$artifact" .
          checksum=$(sha256sum "$archive" | awk '{print $1}')
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            bash "$GITHUB_WORKSPACE/deploy/stephen-production-stage-test.sh" \
            "$SOURCE_SHA" "$archive" "$checksum" \
            "$GITHUB_WORKSPACE/deploy/stephen-remote-release.sh" "$(id -u)"
