name: jianghu

x-backup-config:
  directory: ${BACKUP_DIR:-/var/backups/jianghu}
  retention-days: ${BACKUP_RETENTION_DAYS:-14}

# 江湖 生产部署栈：Postgres + 后端(Fastify) + 前端(Nginx 托管 SPA 并反代 /api)
# 用法：cp .env.production.example .env && 填好密钥 → docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jianghu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jianghu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jianghu} -d ${POSTGRES_DB:-jianghu}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # 仅 compose 内网可达，不对公网暴露端口

  server:
    build:
      # context=仓库根：server 依赖 packages/pde-kernel（file: 协议），构建需两个目录同时可见
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-jianghu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jianghu}?schema=public
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置强随机 JWT_SECRET}
      AI_KEY_SECRET: ${AI_KEY_SECRET:?请在 .env 设置强随机 AI_KEY_SECRET}
      OUTBOUND_ALLOWED_HOSTS: ${OUTBOUND_ALLOWED_HOSTS:?请在 .env 设置服务端出站主机白名单}
      OUTBOUND_ALLOWED_PRIVATE_HOSTS: ${OUTBOUND_ALLOWED_PRIVATE_HOSTS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      DONATE_URL: ${DONATE_URL:-}
      DONATE_QR_URL: ${DONATE_QR_URL:-}
      DONATE_NOTE: ${DONATE_NOTE:-}
      COMMITMENT_COMMANDS_ENABLED: ${COMMITMENT_COMMANDS_ENABLED:-1}
      METHODOLOGY_COMMANDS_ENABLED: ${METHODOLOGY_COMMANDS_ENABLED:-0}
      PRODUCT_EDITION: ${PRODUCT_EDITION:-commercial}
      PRODUCT_ENTITLEMENTS: ${PRODUCT_ENTITLEMENTS:-}
    # 仅经 web 反代访问，不对公网暴露端口

  web:
    build:
      # context=仓库根：app 依赖 packages/domain-contracts（file: 协议）
      context: .
      dockerfile: app/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        # 备案审核期=1 只展示中性介绍页；备案过后置空重建恢复完整应用
        VITE_BEIAN_MODE: ${VITE_BEIAN_MODE:-}
        # 备案号下来后填入，页脚自动显示
        VITE_ICP_BEIAN: ${VITE_ICP_BEIAN:-}
        VITE_POLICE_BEIAN: ${VITE_POLICE_BEIAN:-}
        VITE_POLICE_BEIAN_URL: ${VITE_POLICE_BEIAN_URL:-}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  pgdata:
